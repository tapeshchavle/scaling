server {
    listen 80;
    server_name _;

    # CDN / Load Balancer health check
    location /health {
        limit_req zone=health_limit burst=5 nodelay;
        access_log off;
        return 200 '{"status":"UP","gateway":"nginx"}';
        add_header Content-Type application/json;
    }

    # Food Core API
    location /api/v1/food/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://food_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # CDN cache headers for GET requests
        proxy_cache_valid 200 60s;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=60, s-maxage=120" always;
    }

    # Notification API
    location /api/v1/notifications/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://notification_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # No caching for notification endpoints
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Actuator endpoints (internal only - restrict in production)
    location /actuator/ {
        # In production, restrict to internal IPs
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://food_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Default - 404
    location / {
        return 404 '{"error":"Not Found","message":"The requested resource does not exist"}';
        add_header Content-Type application/json;
    }
}
