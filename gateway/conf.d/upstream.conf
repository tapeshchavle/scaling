# Food Core Service - upstream with load balancing
upstream food_core {
    least_conn;
    server food-core:8081 max_fails=3 fail_timeout=30s;
    # Additional replicas are auto-discovered by Docker DNS
    keepalive 32;
}

# Notification Service - upstream with load balancing
upstream notification_service {
    least_conn;
    server notification-service:8082 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
